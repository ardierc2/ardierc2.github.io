<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Andreas Diercks" >
    <meta name="description" content="Learn how light pollution threatens nocturnal animal's survival after dark." >
    <title>Lights Out - Environments</title>

    <link rel="icon" href="img/favicon.gif">

<body>
    <header>
        <nav class="top-nav">
            <div class="nav-left">
                <a class="nav-home" href="index.html">Lights Out</a>
            </div>
            <div class="nav-center">
                <a class="nav-link" href="twoStep.html">Environments</a>
                <a class="nav-link" href="static.html">Learn More</a>
                <a class="nav-link" href="contactUs.html">Contact Us</a>
            </div>
            <div class="nav-right">
                <a class="nav-login" href="index.html">Login</a>
            </div>
        </nav>

        <div class="hero">
            <img class="hero-image" src="img/nightSkyline3.0.webp"
                alt="Mountainous skyline, fading into the stars at sunset.">
            <!-- Hero Image was generated with AI -->
            <h1 class="hero-title">Environments</h1> 
        </div>
    </header>

    <main>
        <hr class="section-bar">
        <section class="content-box" aria-label="Environment selection gallery">

            <figure class="section-figure">
                <div class="two-step">
                    <div class="two-step-list">
                        
                        <!-- All images in this section are sourced from pexels.com -->
                        <div class="two-step-card">
                            <button id="card1">
                                <img class="wide-img-window" src="img/Raccoon.jpg" alt="A raccoon in an urban environment, attention fixed on something off camera.">
                                <div class="explore-bar" aria-hidden="true"></div>
                                <strong class="two-step-title" >Urban</strong>
                            </button>
                        </div>
                        
                        <div class="two-step-card">
                            <button id="card2">
                                <img class="wide-img-window" src="img/FennecFox.jpg" alt="A fennec fox in the desert with city lights flooding the distant horizons.">
                                <div class="explore-bar" aria-hidden="true"></div>
                                <strong class="two-step-title" >Desert</strong>
                            </button>
                        </div>

                        <div class="two-step-card">
                            <button id="card3">
                                <img class="wide-img-window" src="img/GreatHornedOwl.jpg" alt="An owl in the trees staring down at the viewer.">
                                <div class="explore-bar" aria-hidden="true"></div>
                                <strong class="two-step-title" >Forest</strong>
                            </button>
                        </div>

                        <div class="two-step-card">
                            <button id="card4">
                                <img class="wide-img-window" src="img/SeaTurtle.jpg" alt="A loggerhead sea turtle traveling from the right side of the screen to the left in golden sand.">
                                <div class="explore-bar" aria-hidden="true"></div>
                                <strong class="two-step-title" >Coastal</strong>
                            </button>
                        </div>
                    </div>
                </div>
                <figcaption class="figure-image-source">
                    Above Images cited on their respective pages.
                </figcaption>
            </figure>

            <button class="button back-button" id="twoStep-back">Back to Lights Out</button>

        </section>
        <hr class="section-bar">


    </main>
