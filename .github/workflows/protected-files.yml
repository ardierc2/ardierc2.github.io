name: Protected files guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if protected files changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')

          # Edit this regex to list your protected paths
          protected='^[1-5]/'

          hits=$(echo "$files" | grep -E "$protected" || true)
          if [ -n "$hits" ]; then
            echo "::error::This PR modifies protected files:"
            echo "$hits"
            exit 1
          fi
