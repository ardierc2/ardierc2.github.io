<!DOCTYPE html>

    <title>Project 3 - Contact Us</title>

    <link rel="icon" href="img/favicon.gif">
    <link rel="stylesheet" href="css/style.css" >

</head>
<body>
    <header>
        <nav class="top-nav">
            <div class="nav-left">
                <a class="nav-home" href="index.html">Lights Out</a>
            </div>
            <div class="nav-center">
                <a class="nav-link" href="twoStep.html">Environments</a>
                <a class="nav-link" href="static.html">Learn More</a>
                <a class="nav-link" href="contactUs.html">Contact Us</a>
            </div>
            <div class="nav-right">
                <a class="nav-login" href="index.html">Login</a>
            </div>
        </nav>
        <div class="hero">
            <img class="hero-image" src="img/nightSkyline3.0.webp"
                alt="Mountainous skyline, fading into the stars at sunset.">
            <h1 class="hero-title">Contact Us</h1> 
        </div>
        
    </header>

    <main>
        <hr class="section-bar">
        <section class="content-box">

            <div class="form-container">

                <img class="form-img" src="img/hatchlingJourney.png" alt="placeholder image for contact form">

                <form class="contact-form" action="" method="">

                    <div class="contact-form-name">
                        <label for="name">Name:</label><br>
                        <input class="form-input" type="text" name="name" id="name" required>
                    </div>

                    <div class="contact-form-email">
                        <label for="email">Email:</label><br>
                        <input class="form-input" type="email" name="email" id="email" required>
                    </div>

                    <div class="contact-form-text">
                        <label for="text">Suggestions and Feedback:</label><br>
                        <textarea class="form-input" name="text" id="text" rows="6" required></textarea>
                    </div>

                    <div class="contact-form-submit">
                        <input class="button submit-button" type="submit" value="Submit!">
                    </div>

                </form>
            </div>

        </section>
        <hr class="section-bar">
    </main>

    <footer>
        <p>&copy;2026 Andreas Diercks - 
        <a href="mailto:ardierc2@go.olemiss.edu">ardierc2@go.olemiss.edu</a>
        </p>
    </footer>
</body>
</html>
